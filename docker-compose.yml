services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: freebuff
      POSTGRES_USER: freebuff
      POSTGRES_PASSWORD: freebuff_local_only
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freebuff -d freebuff"]
      interval: 5s
      timeout: 3s
      retries: 20
  sandbox-base:
    build: { context: ./infra/sandbox }
    profiles: ["sandbox-build"]
    read_only: true
    tmpfs: ["/tmp:size=256m,noexec,nosuid"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 1g
    cpus: 1.0
    networks: [sandbox_internal]
volumes:
  postgres_data:
networks:
  sandbox_internal:
    internal: true
